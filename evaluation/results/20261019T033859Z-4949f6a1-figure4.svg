<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="420" viewBox="0 0 900 210"><rect width="900" height="210" fill="#FFF8EF"/><text x="35" y="38" font-family="Arial" font-size="23" font-weight="bold" fill="#304651">Figure 4 · Approval lifecycle</text><text x="35" y="61" font-family="Arial" font-size="12" fill="#536A70">Deterministic policy integration test, not a human study</text><rect x="35" y="91" width="190" height="55" rx="9" fill="#168C88"/><text x="45" y="122" font-family="Arial" font-size="11" fill="white">Injected $150 proposal</text><text x="228" y="122" font-family="Arial" font-size="20" fill="#304651">→</text><rect x="245" y="91" width="190" height="55" rx="9" fill="#168C88"/><text x="255" y="122" font-family="Arial" font-size="11" fill="white">Policy: approval required</text><text x="438" y="122" font-family="Arial" font-size="20" fill="#304651">→</text><rect x="455" y="91" width="190" height="55" rx="9" fill="#168C88"/><text x="465" y="122" font-family="Arial" font-size="11" fill="white">Approve exact / Reject</text><text x="648" y="122" font-family="Arial" font-size="20" fill="#304651">→</text><rect x="665" y="91" width="190" height="55" rx="9" fill="#168C88"/><text x="675" y="122" font-family="Arial" font-size="11" fill="white">Apply once / Preserve prior</text><text x="35" y="181" font-family="Arial" font-size="11" fill="#536A70">Natural LLM approval requests in this run: 0. Test actions are excluded from benchmark counts.</text></svg>